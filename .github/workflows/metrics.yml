name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1) General stats card
      - name: General stats
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: himashruwanga
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Colombo
          config_display: large

      # 2) Top languages
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: himashruwanga
          base: ""
          config_timezone: Asia/Colombo
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

      # 3) Contribution calendar (full year)
      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: himashruwanga
          base: ""
          config_timezone: Asia/Colombo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 4) Featured project cards (from your himashreigns account)
      - name: Featured projects
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/projects.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: himashreigns
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: himashreigns/AgroPredict, himashreigns/realEstate
